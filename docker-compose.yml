services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      REDIS_URL: redis://redis:6379
      # Override these for any real deploy:
      JWT_SECRET: ${JWT_SECRET:-change-me-min-16-characters-long}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}

volumes:
  redis-data:
