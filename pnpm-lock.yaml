lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/domain:
    dependencies:
      '@literature/shared':
        specifier: workspace:*
        version: link:../shared

  packages/engine:
    dependencies:
      '@literature/shared':
        specifier: workspace:*
        version: link:../shared

  packages/shared: {}

  packages/ui-web:
    dependencies:
      '@literature/domain':
        specifier: workspace:*
        version: link:../domain
      '@literature/shared':
        specifier: workspace:*
        version: link:../shared
