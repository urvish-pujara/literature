lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  apps/server:
    dependencies:
      '@literature/engine':
        specifier: workspace:*
        version: link:../../packages/engine
      '@literature/shared':
        specifier: workspace:*
        version: link:../../packages/shared

  apps/web:
    dependencies:
      '@literature/domain':
        specifier: workspace:*
        version: link:../../packages/domain
      '@literature/shared':
        specifier: workspace:*
        version: link:../../packages/shared
      '@literature/ui-web':
        specifier: workspace:*
        version: link:../../packages/ui-web

  packages/domain:
    dependencies:
      '@literature/shared':
        specifier: workspace:*
        version: link:../shared

  packages/engine:
    dependencies:
      '@literature/shared':
        specifier: workspace:*
        version: link:../shared

  packages/shared: {}

  packages/ui-web:
    dependencies:
      '@literature/domain':
        specifier: workspace:*
        version: link:../domain
      '@literature/shared':
        specifier: workspace:*
        version: link:../shared
